<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>Weather Lookup</h1>
    <form id="weather-form">
      <input type="text" id="city-input" placeholder="Enter a city name" autocomplete="off">
      <button type="submit">Get weather</button>
    </form>

    <p id="error-message" class="error hidden"></p>

    <section id="result" class="result hidden">
      <div class="result-header">
        <img id="weather-icon" src="" alt="">
        <div>
          <h2 id="result-city"></h2>
          <p id="result-description"></p>
        </div>
      </div>
      <div class="result-grid">
        <div><span class="label">Temperature</span><span id="result-temp"></span></div>
        <div><span class="label">Feels like</span><span id="result-feels-like"></span></div>
        <div><span class="label">Humidity</span><span id="result-humidity"></span></div>
        <div><span class="label">Wind speed</span><span id="result-wind"></span></div>
      </div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
